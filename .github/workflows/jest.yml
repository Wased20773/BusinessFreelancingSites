name: Jest Tests

on:
  pull_request:
    branches:
      - platform-dashboard

  push:
    branches:
      - platform-dashboard

  workflow_dispatch:

jobs:
  jest:
    name: Jest Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run platform Jest tests
        working-directory: apps/platform
        run: npm test -- --runInBand
