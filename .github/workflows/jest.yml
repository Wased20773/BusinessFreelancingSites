name: Jest Tests

on:
  pull_request:
    branches:
      - platform-dashboard
      - redesign-dashboard-logic

  push:
    branches:
      - platform-dashboard
      - redesign-dashboard-logic

  workflow_dispatch:

jobs:
  jest:
    name: Jest Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22.18+ loads jest.config.ts natively. On Node 20, Jest
          # needs ts-node to read it and fails before running any test.
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # The Prisma Client is generated into packages/database/generated,
      # which is gitignored, so it has to be generated on every run.
      # No database connection is needed to generate it.
      - name: Generate Prisma Client
        working-directory: packages/database
        run: npx prisma generate

      - name: Run platform Jest tests
        working-directory: apps/platform
        run: npm test -- --runInBand
